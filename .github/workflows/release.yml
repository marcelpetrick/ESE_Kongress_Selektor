name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the shared quality gate
        run: python localPipeline.py

  release:
    name: Publish GitHub Release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate the release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must have the form vMAJOR.MINOR.PATCH; got: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

      - name: Build the clean source bundle and checksum
        shell: bash
        run: |
          mkdir dist
          archive="ESE_Kongress_Selektor-$RELEASE_TAG.zip"
          git archive \
            --format=zip \
            --prefix="ESE_Kongress_Selektor-$RELEASE_TAG/" \
            --output="dist/$archive" \
            "$RELEASE_TAG"
          cd dist
          sha256sum "$archive" > SHA256SUMS.txt

      - name: Publish or update the GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

          # Keep reruns idempotent while guaranteeing a public stable release,
          # even if the existing release was previously a draft or prerelease.
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease=false \
            --latest
